name: Release

# npm trusted publisher: dominikbiskupovic/teemo-tween, workflow publish.yml (keep this filename).
# On every push to main: if changesets are pending, open or update the "Version packages" PR.
# When that PR is merged (no changesets left, version bumped), scripts/release.sh stages the new
# version on npm through trusted publishing (OIDC). A maintainer then approves it with 2FA on
# npmjs.com (Staged Packages). No npm token is stored anywhere.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Staged publishing through trusted publishing needs npm 11.15.0 or later.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run check
      - uses: changesets/action@v2
        with:
          version-script: npm run version
          publish-script: npm run release
          commit-message: "Version packages"
          pr-title: "Version packages"
