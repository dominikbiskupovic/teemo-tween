name: Release

# On every push to main: if changesets are pending, open or update the "Version Packages" PR.
# When that PR is merged (no changesets left, version bumped), publish to npm through
# trusted publishing (OIDC). No npm token is stored anywhere; provenance is automatic.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run check
      - uses: changesets/action@v2
        with:
          version-script: npm run version
          publish-script: npm run release
          commit-message: "Version packages"
          pr-title: "Version packages"
